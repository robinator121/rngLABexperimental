name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install scientific dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib cryptography pytest

    - name: Run automated test suite
      run: |
        PYTHONPATH=src pytest tests -v

    - name: Install package and run isolated crypto smoke campaign
      run: |
        pip install '.[crypto]'
        python -m rnglab_crypto run --smoke --output /tmp/blue-smoke
        python -m rnglab_crypto verify /tmp/blue-smoke
        python -m rnglab_crypto run --smoke --no-plots --output /tmp/blue-replay
        cmp /tmp/blue-smoke/results.json /tmp/blue-replay/results.json
